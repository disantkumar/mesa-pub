
# This sample config file disables all of the ChromiumOS source style checks.
# Comment out the disable-flags for any checks you want to leave enabled.
[Hook Overrides]
# This is not our code base, so we can't claim copyright/license.
cros_license_check: false
# This code does not conform to Chromium OS style guides
blank_line_check: false
keyword_check: false
long_line_check: false
tab_check: false
# Uncomment the following if it gets too annoying.
stray_whitespace_check: false
